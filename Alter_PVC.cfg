[profile]
# Default profile for Make7Segment.py
# Edit values as needed. Blank or 'None' means leave unset.
# Created time: 2026-Sep-2 01:30 PM

board-height = 100.0
board-width = 64.0
board-thickness = 6.5

# Geometry
height = 85.0
width = 50.0
stroke = 6.0
radius = 10.0

# CAM / cutting
# For outside edge parameter, smaller bit
bit = 2.0
depth = 10 
passdepth = 1.0
cutting-paths = 10

spindle-speed = 10000
feed = 1200.0
plunge = 300.0

show-board-dim = false
outprefix = A

# Segment tuning
gap = 0.0
overlap = 2.0
hgap = 0.0
vert-length = 0.0
hort-length = 40.0
allow-vertical-overlap = true

# Rendering and union
render-source = poly
use-shapely = true
no-shapely = false
rotate = true

# For webp file
board-outline = dashed
debug-centers = true

# Gcode file
debug-gcode = false
pause-after-seg = false
pause-after-layer = false

# Pocketing options
# Use special Genmitsu Flat Nose End Mill 1/8" shank (3.175 mm)
pocket-middle = true
pocket-step = 1.0
rough-bit = 3.175
# rough-step (deep) max is 2mm 
rough-step = 1.25
rough-feed = 1200.0
pocket-inset = 0.25
rough-last = false

# Free-form comment: add any notes below. Indent continuation lines to keep them part of the same value.
comment = This is the thick_board.cfg for Make7Segment.py
    Got the 1/2" (19mm) thick 3/4" width Poles and PVC boards.
    Let try to cut the segements with depth.

