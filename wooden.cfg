[profile]
# Default profile for Make7Segment.py
# Edit values as needed. Blank or 'None' means leave unset.
# Created time: 2026-Aug-31 08:20 PM

# Geometry
height = 150.0
width = 80.0
stroke = 8.0
radius = 5.0

# CAM / cutting
bit = 3.0
depth = 
passdepth = 0.5
board-thickness = 3.5
cutting-paths = 8
board-height = 172.0
board-width = 100.0
show-board-dim = false
outprefix = W
spindle-speed = 10000
feed = 1200.0
plunge = 300.0

# Segment tuning
gap = 0.0
overlap = 2.0
hgap = 0.0
vert-length = -8.0
hort-length = 55.0
allow-vertical-overlap = true

# Rendering and union
render-source = poly
use-shapely = false
no-shapely = false
rotate = true
board-outline = dashed
debug-centers = true
debug-gcode = false
pause-after-seg = true

# Free-form comment: add any notes below. Indent continuation lines to keep them part of the same value.
comment = This is a default profile.cfg for Make7Segment.py
    I tested the above values (2026-Aug-31) with 3.5mm thick wooden board.
