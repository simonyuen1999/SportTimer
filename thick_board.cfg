[profile]
# Default profile for Make7Segment.py
# Edit values as needed. Blank or 'None' means leave unset.
# Created time: 2026-Sep-1 01:30 PM

board-height = 100.0
board-width = 64.0
board-thickness = 6.5

# Geometry
height = 85.0
width = 50.0
stroke = 6.0
radius = 10.0

# CAM / cutting
bit = 2.5
depth = 4 
passdepth = 1.0
cutting-paths = 4

spindle-speed = 10000
feed = 1200.0
plunge = 300.0

show-board-dim = false
outprefix = T

# Segment tuning
gap = 0.0
overlap = 2.0
hgap = 0.0
vert-length = -10.0
hort-length = 45.0
allow-vertical-overlap = true

# Rendering and union
render-source = poly
use-shapely = true
no-shapely = false
rotate = true

board-outline = dashed
debug-centers = true
debug-gcode = false
pause-after-seg = true

# Pocketing options
pocket-middle = true
pocket-step = 1.0
rough-bit = 6.0
rough-step = 1.5

# Free-form comment: add any notes below. Indent continuation lines to keep them part of the same value.
comment = This is the thick_board.cfg for Make7Segment.py
    Got the 1/2" (19mm) thick 3/4" width Poles and PVC boards.
    Let try to cut the segements with depth.

