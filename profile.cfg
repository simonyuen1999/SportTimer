[profile]
# Default profile for Make7Segment.py
# Edit values as needed. Blank or 'None' means leave unset.
# Generated time: 2026-Aug-31 07:44 PM

# Geometry
height = 120.0
width = 80.0
stroke = 16.0
radius = 10.0

# CAM / cutting
bit = 2.0
depth = 
passdepth = 0.5
board-thickness = 4.5
cutting-paths = 10
board-height = 172.0
board-width = 100.0
show-board-dim = false
outprefix = N
spindle-speed = 10000
feed = 1200.0
plunge = 300.0

# Segment tuning
gap = 0.0
overlap = 2.0
hgap = 1.0
vert-length = 5.0
hort-length = 50.0
allow-vertical-overlap = true

# Rendering and union
render-source = poly
use-shapely = false
no-shapely = false
rotate = true
board-outline = dashed
debug-centers = true
debug-gcode = false
pause-after-seg = false

# Free-form comment: add any notes below. Indent continuation lines to keep them part of the same value.
comment = This is a default profile.cfg for Make7Segment.py
    I tested the above values (2026-Aug-31) with 4.5mm thick PVC board.
    The strokes (segments) are too close to each other.
    I can use bigger height and width, and bigger gap (space between segments) to make the display more readable.
